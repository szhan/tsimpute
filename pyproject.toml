[project]
name = "tsimpute"
description = "Genome-wide genotype imputation using tree sequences"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Shing Hei Zhan", email = "shing.zhan@ndph.ox.ac.uk"},
]
requires-python = ">=3.12"
dependencies = [
  "click",
  "tskit",
  "msprime",
  "zarr",
  "numpy",
  "numba",
  "tsls",
]
dynamic = ["version"]

[project.scripts]
bacts = "tsimpute.cli:cli"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-coverage",
]

[build-system]
requires = [
    "setuptools>=42",
    "setuptools_scm",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tsimpute"]

[tool.setuptools_scm]
write_to = "tsimpute/_version.py"

[tool.uv.sources]
tsls = { git = "https://github.com/tskit-dev/tsls" }

